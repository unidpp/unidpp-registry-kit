name: test
on:
  push:
    branches: [main]
  pull_request:

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile-check every seed script
        run: |
          set -eu
          shopt -s nullglob
          py_ok=0
          for f in bin/*.py; do
            python3 -m py_compile "$f"
            echo "ok: $f"
            py_ok=1
          done
          if [ "$py_ok" = "0" ]; then
            echo "no bin/*.py seed scripts found"
          fi
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No toolchain step: rustup resolves rust-toolchain.toml at
      # every cargo invocation, so CI installs and formats with the
      # exact pinned generation (the file is the single source).
      - name: Format
        run: cargo fmt --all -- --check
      - name: Build
        run: cargo build --all-targets
      - name: Test
        run: cargo test
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
