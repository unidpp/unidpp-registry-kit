name: test
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No toolchain step: rustup resolves rust-toolchain.toml at
      # every cargo invocation, so CI installs and formats with the
      # exact pinned generation (the file is the single source).
      - name: Format
        run: cargo fmt --all -- --check
      - name: Build
        run: cargo build --all-targets
      - name: Test
        run: cargo test
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
